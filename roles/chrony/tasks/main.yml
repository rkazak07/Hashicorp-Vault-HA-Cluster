---
- name: "Install chrony"
  apt:
    name: chrony
    state: present
    update_cache: yes

- name: "Deploy chrony.conf"
  template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
  notify:
    - restart chrony

- name: "Enable & Start chrony"
  systemd:
    name: chrony
    enabled: yes
    state: started
