---
- name: "Read vault_init.json from first node (for all nodes)"
  shell: cat "{{ vault_key_path }}"
  delegate_to: "{{ groups['vault'][0] }}"
  register: remote_vault_keys
  run_once: true

- name: "Retrieve Vault root token"
  set_fact:
    vault_root_token: "{{ remote_vault_keys.stdout | from_json | json_query('root_token') }}"

- name: "Login to Vault using root token"
  command: vault login {{ vault_root_token }}
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  become: yes
  when:
    - inventory_hostname == groups['vault'][0]

- name: "Check if AppRole authentication is already enabled"
  command: vault auth list -format=json
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  register: vault_auth_list
  changed_when: false
  become: yes

- name: "Enable AppRole authentication if not already enabled"
  command: vault auth enable approle
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  become: yes
  when:
    - inventory_hostname == groups['vault'][0]
    - "'approle/' not in (vault_auth_list.stdout | from_json)"

- name: "Create Vault backup policy"
  shell: |
    cat <<EOF | vault policy write vault-backup-policy -
    path "sys/storage/raft/snapshot" {
      capabilities = ["read"]
    }
    path "sys/storage/raft/snapshot/*" {
      capabilities = ["create", "update"]
    }
    EOF
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  become: yes
  when:
    - inventory_hostname == groups['vault'][0]

- name: "Create Vault backup AppRole"
  command: >
    vault write auth/approle/role/vault-backup-role \
      token_policies=vault-backup-policy,default \
      token_max_ttl=20m
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  become: yes
  when:
    - inventory_hostname == groups['vault'][0]

- name: "Retrieve Role ID"
  command: vault read -format=json auth/approle/role/vault-backup-role/role-id
  register: role_id
  changed_when: false
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  become: yes
  when:
    - inventory_hostname == groups['vault'][0]

- name: "Retrieve Secret ID"
  command: vault write -force -format=json auth/approle/role/vault-backup-role/secret-id
  register: secret_id
  changed_when: false
  environment:
    VAULT_ADDR: "https://127.0.0.1:8200"
    VAULT_SKIP_VERIFY: "true"
  become: yes
  when:
    - inventory_hostname == groups['vault'][0]

- name: "Store Role ID and Secret ID"
  copy:
    content: >
      {
        "ROLE_ID": "{{ role_id.stdout | from_json | json_query('data.role_id') }}",
        "SECRET_ID": "{{ secret_id.stdout | from_json | json_query('data.secret_id') }}"
      }
    dest: "/etc/vault.d/vaultbackup-approle.json"
    owner: root
    group: root
    mode: '0600'
  when:
    - inventory_hostname == groups['vault'][0]

- name: "Distribute vaultbackup-approle.json to all nodes"
  copy:
    src: "/etc/vault.d/vaultbackup-approle.json"
    dest: "/etc/vault.d/vaultbackup-approle.json"
    owner: root
    group: root
    mode: '0600'
  delegate_to: "{{ item }}"
  loop: "{{ groups['vault'] }}"
  when: inventory_hostname == groups['vault'][0]