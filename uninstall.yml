---
- name: Uninstall Vault and related components
  hosts: vault
  become: yes
  tasks:
  
    - name: Stop and disable Vault service
      systemd:
        name: vault
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove Vault package
      apt:
        name: vault
        state: absent
      ignore_errors: yes
    
    - name: Remove Vault service files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/systemd/system/vault.service"
        - "/lib/systemd/system/vault.service"
      ignore_errors: yes

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Remove Vault configuration files
      file:
        path: "{{ item }}"
        state: absent
        recurse: yes
      loop:
        - "{{ vault_tls_path}}"
        - "{{ vault_raft_path}}"
        - "/etc/vault.d"
        - "/usr/local/bin/vault"
        - "/var/log/vault.log"
        - "/usr/share/keyrings/hashicorp-archive-keyring.gpg"
        - "/etc/apt/sources.list.d/hashicorp.list"
      ignore_errors: yes

    - name: Remove Vault system user
      user:
        name: vault
        state: absent
      ignore_errors: yes

    - name: Stop and disable Keepalived
      systemd:
        name: keepalived
        state: stopped
        enabled: no
      ignore_errors: yes

    - name: Remove Keepalived package
      apt:
        name: keepalived
        state: absent
      ignore_errors: yes

    - name: Remove Keepalived configuration files
      file:
        path: "/etc/keepalived/"
        state: absent
        recurse: yes
      ignore_errors: yes

    - name: Remove iptables rules
      file:
        path: "/etc/iptables/rules.v4"
        state: absent
      when: "{{ iptables_install | default(false) | bool }}"

    - name: Flush iptables rules
      shell: iptables -F
      ignore_errors: yes
      when: "{{ iptables_install | default(false) | bool }}"

    - name: Remove iptables and vault package (if installed)
      apt:
        name: 
          - iptables
          - iptables-persistent
          - vault
        state: absent
      ignore_errors: yes
      when: "{{ iptables_install | default(false) | bool }}"

    - name: Remove auditlog files (Recursive Delete)
      file:
        path: "{{ vault_audit_path }}"
        state: absent
        recurse: yes
      ignore_errors: yes

    - name: Remove backup files (Recursive Delete)
      file:
        path: "{{ backup_path }}"
        state: absent
        recurse: yes
      ignore_errors: yes
