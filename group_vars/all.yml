# This domain name will be used in application access and config files.
# Ensure that it is compatible with the certificate being used.
vault_domain_name: "domain.com"

# Specify the virtual IP address for the keepalived service.
vault_virtual_ip_address: "192.168.117.200"

# Update the /etc/hosts file based on domain and server names.
# Ensure domain names are compatible with the certificate. To activate /etc/hosts settings, do "hosts_entries_enabled: true"
hosts_entries_enabled: false
hosts_entries:
  - ip: "192.168.117.133"
    fqdn: "vault01.domain.com"
    short: "vault01"
  - ip: "192.168.117.134"
    fqdn: "vault02.domain.com"
    short: "vault02"
  - ip: "192.168.117.135"
    fqdn: "vault03.domain.com"
    short: "vault03"
  - ip: "192.168.117.200" # virtual IP address
    fqdn: "vault.domain.com"  # This address will be used for application access and UI.
    short: "vault"

# DEBIAN/UBUNTU
# Set iptables_install to true to proceed with iptables installation.
# If you already have a firewall, set it to false.
# iptables rules must be configured based on server IP addresses.
# Be sure to include the virtual IP address as well.
iptables_install: true
iptables_rules_v4:
  - "-A INPUT -p tcp -m tcp --dport 22 -j ACCEPT"
  - "-A INPUT -p tcp -m tcp --dport 443 -j ACCEPT"
  - "-A INPUT -p tcp -m tcp --dport 8200 -j ACCEPT"
  - "-A INPUT -s 192.168.117.133/32 -p tcp -m tcp -j ACCEPT"
  - "-A INPUT -s 192.168.117.134/32 -p tcp -m tcp -j ACCEPT"
  - "-A INPUT -s 192.168.117.135/32 -p tcp -m tcp -j ACCEPT"
  - "-A INPUT -s 192.168.117.133/32 -p udp -m udp -j ACCEPT"
  - "-A INPUT -s 192.168.117.134/32 -p udp -m udp -j ACCEPT"
  - "-A INPUT -s 192.168.117.135/32 -p udp -m udp -j ACCEPT"

## RHEL/OEL
# Set to true if firewalld installation/configuration is required for RHEL/OEL.
firewalld_install: false

# Rules to be opened on firewalld (example)
# You can define ports or services simply.
firewalld_rules:
  - service: ssh
  - port: "443/tcp"
  - port: "8200/tcp"
  - port: "8201/tcp"
  - port: "122/tcp"
  - port: "22/tcp"

