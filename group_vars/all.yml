# Chrony NTP servers
# To activate chrony settings, do "ntp_servers_enabled: true"
ntp_servers_enabled: false
ntp_servers:
  - "0.tr.pool.ntp.org"
  - "1.tr.pool.ntp.org"

# Specify the Vault version.
# For a different version tag, refer to: https://releases.hashicorp.com/vault/

## For debian/ubuntu: use 'vault_deb_version: "vault=1.18.5-1"'
## For rhel/oel: use 'vault_rhel_version: "vault-1.18.5-1"'

vault_deb_version: "vault=1.18.5-1" # debian/ubuntu
vault_rhel_version: "vault-1.18.5-1" # rhel/oel
vault_init_keys: 5
vault_init_threshold: 2
vault_cluster_name: "SAMPLE-CLUSTER"
vault_log_level: "info" # Options: trace, info, debug, error, warning

# Self-signed (true) or wildcard (false)
# Self-signed support is in development.
# If set to false, you can place your own certificates under roles/vault/files.
# A sample certificate is provided for file naming reference.
self_signed: false
self_signed_cert_days: "730"

# SAN information required for self-signed certificates
vault_tls_alt_names:
  dns:
    - "*.domain.com"
    - "vaul01.domain.com"
    - "vaul02.domain.com"
    - "vaul03.domain.com"
    - "vault.domain.com"
  ip:
    - "127.0.0.1"
    - "192.168.117.133"
    - "192.168.117.134"
    - "192.168.117.135"
    - "192.168.117.200"

# You can adjust the Vault TLS and raft paths according to your system.
# vault_key_path is used to deliver unseal keys to the specified location on the first Vault server.
vault_tls_path: "/opt/vault-tls"
vault_raft_path: "/opt/datavault/raft"
vault_key_path: "/etc/vault.d/vault_init.json"
vault_audit_path: "/var/log/vault" # Specify the audit log directory. Only the leader server will store audit logs. Adjust your SIEM product considering possible leader changes.
auditlog_retention_days: 7 # Logrotate retention period for audit logs
auditlog_logrotate_path: "/etc/logrotate.d/vault_audit" # Path to the logrotate config file for audit logs

# To activate the backup structure, define the following variables:
backup_enabled: true # If false, the backup structure will not be created.
backup_retention_days: 30  # Number of backups to retain
backup_path: /backup/vault-backup  # Directory where backups will be stored
backup_webhook_url: "https://example.webhook.office.com/webhookb2/..."  # Webhook URL for backup notifications
backup_cron_schedule: "0 2 * * *"  # Runs every day at 2:00 AM. Backups will be managed by the crontab on the leader node.
backup_platform: "teams" # Choose between: slack, teams, discord, generic
backup_domain_address: "https://vault.domain.com:8200" # Adjust this address based on the domain name assigned to the virtual IP. If this address is not resolvable, backup will not run.

# After wiping all configurations, set this to true to allow reboot.
# This parameter only works with the "uninstall.yml" playbook.
reboot_after_uninstall: false
