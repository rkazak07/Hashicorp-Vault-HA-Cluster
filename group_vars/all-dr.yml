### DISASTER RECOVERY SETTINGS

# DR-related settings
# If set to true, DR setup will be activated. For DR setup, the vault_dr hosts in the hosts.ini file will be considered.
# For the disaster recovery structure to work, the Prod Vault servers must be configured using this Ansible playbook. It syncs the Prod cluster with the DR cluster every 5 minutes.
dr_enabled: false 

# Specify the virtual IP address for the keepalived service.
vault_dr_virtual_ip_address: "192.168.118.200"

# Edit the /etc/hosts file according to the domain and server names. Make sure the domain names are compatible with the certificate.
To activate /etc/hosts settings, do "hosts_entries_enabled: true"
hosts_entries_enabled: false
hosts_entries:
  - ip: "192.168.118.133"
    fqdn: "dr-vault01.domain.com"
    short: "dr-vault01"
  - ip: "192.168.118.134"
    fqdn: "dr-vault02.domain.com"
    short: "dr-vault02"
  - ip: "192.168.118.135"
    fqdn: "dr-vault03.domain.com"
    short: "dr-vault03"
  - ip: "192.168.118.200" # virtual IP address
    fqdn: "dr-vault.domain.com"  # This will be used for application access and UI
    short: "dr-vault"

# DEBIAN/UBUNTU
# To proceed with iptables installation, set iptables_install to true. If you have an existing firewall, set it to false.
# The iptables rules should be configured based on the server IP addresses. Be sure to include the virtual IP address.
iptables_install: true
iptables_rules_v4:
  - "-A INPUT -p tcp -m tcp --dport 22 -j ACCEPT"
  - "-A INPUT -p tcp -m tcp --dport 443 -j ACCEPT"
  - "-A INPUT -p tcp -m tcp --dport 8200 -j ACCEPT"
  - "-A INPUT -s 192.168.118.133/32 -p tcp -m tcp -j ACCEPT"
  - "-A INPUT -s 192.168.118.134/32 -p tcp -m tcp -j ACCEPT"
  - "-A INPUT -s 192.168.118.135/32 -p tcp -m tcp -j ACCEPT"
  - "-A INPUT -s 192.168.118.133/32 -p udp -m udp -j ACCEPT"
  - "-A INPUT -s 192.168.118.134/32 -p udp -m udp -j ACCEPT"
  - "-A INPUT -s 192.168.118.135/32 -p udp -m udp -j ACCEPT"
  - "-A INPUT -s 192.168.117.133/32 -p tcp -m tcp -j ACCEPT" # Prod site
  - "-A INPUT -s 192.168.117.134/32 -p tcp -m tcp -j ACCEPT" # Prod site
  - "-A INPUT -s 192.168.117.135/32 -p tcp -m tcp -j ACCEPT" # Prod site
  - "-A INPUT -s 192.168.117.133/32 -p udp -m udp -j ACCEPT" # Prod site
  - "-A INPUT -s 192.168.117.134/32 -p udp -m udp -j ACCEPT" # Prod site 
  - "-A INPUT -s 192.168.117.135/32 -p udp -m udp -j ACCEPT" # Prod site

## RHEL/OEL
# Set to "true" if firewalld needs to be installed/configured for RHEL/OEL systems.
firewalld_install: false

# Rules to be opened on firewalld (example)
# You can simply define them as services or ports.
firewalld_rules:
  - service: ssh
  - port: "443/tcp"
  - port: "8200/tcp"
  - port: "8201/tcp"
  - port: "122/tcp"
  - port: "22/tcp"

